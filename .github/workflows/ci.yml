name: CI

# Builds and runs the full test suite on every pull request, so a change
# (Renovate's included) is tested before it can merge. Pushes to main are
# covered by the image build in publish.yml, which runs the same suite.
# Actions are pinned to commit SHAs; the comment names the release.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build and test
        run: ./gradlew --no-daemon build
